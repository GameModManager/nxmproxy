name: CI

# CI's job is to BUILD. Tests are run by whoever changes the code, on their own
# machine, where a failure is a two-second iteration rather than a queue. The
# suite is not deleted - `cargo test` runs all of it - it is simply not run here
# on every commit. What remains is what only CI can do: compile the crate on
# Linux, macOS and Windows at the same time, with warnings as errors, so a
# change that is Unix-only by accident never reaches a user.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep the build honest and self-contained.
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # What this proves on macOS and Windows: the crate compiles there, and
      # the pure logic, the platform module text, and the "macOS and Windows
      # never report a verified claim" rule are correct - that rule is a
      # decision, not FFI, so it is enforced from every platform's build.
      # What it does NOT prove: that LSSetDefaultHandlerForURLScheme makes
      # macOS offer the bundle, or that reg.exe writes the keys we intend.
      # Those need a real machine and a real click, and are called out as
      # unverified in README.md.
      #
      # THE TRADE, stated plainly. This job used to end with `cargo test` and a
      # CLI smoke test, and both of those EXECUTED the built binary - on macOS
      # and Windows as well as on Linux. That was the only run-check the binary
      # ever got on those two platforms. It is deliberately given up: CI builds,
      # whoever changed the code runs it. So macOS and Windows are compile-only
      # from here, and a change that compiles there but misbehaves when run is
      # not caught here. Named rather than quietly dropped.
      - name: Build
        run: cargo build --release
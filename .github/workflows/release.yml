# SPDX-License-Identifier: GPL-3.0-or-later
# Fork of https://github.com/TanninOne/nxmproxy - see NOTICE.md

# Produces the binaries users download: one static Linux x86_64 and one
# universal macOS. Nothing here creates a tag and nothing here is required to
# test anything: a tag says "this version is real", which is a human decision,
# so the pipeline sits unused until someone makes it.
name: Release

on:
  push:
    tags: ["v*"]
  # Builds the same artifact and uploads it as a workflow artifact, but
  # publishes nothing. This is how the pipeline is proved before a release
  # exists: run it from Actions, download the artifact, run it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build from (blank = the ref the run started on)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The same standard the build on main is held to.
  RUSTFLAGS: "-D warnings"

jobs:
  linux-x86_64:
    name: Linux x86_64 (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-release

      # musl, statically linked, and not glibc.
      #
      # A glibc build of this crate made on this runner links against
      # GLIBC_2.39 and will not start on Ubuntu 22.04 (2.35), Debian 12 (2.36)
      # or anything older - "version `GLIBC_2.39' not found", for a program the
      # user could have run. nxmproxy uses no C library facility that musl
      # lacks: no NSS, no locale collation, no dlopen, no threads beyond what
      # musl provides. So the binary links nothing and runs anywhere, at a cost
      # of roughly 400 KB.
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          NAME="nxmproxy-${VERSION}-linux-x86_64"
          mkdir -p dist
          install -m 755 target/x86_64-unknown-linux-musl/release/nxmproxy "dist/$NAME"
          # dist/ holds the binary and nothing else. A release asset is permanent
          # storage, and GPL-3 does not need it: the licence text and the upstream
          # attribution ship in the repository (LICENSE.md, NOTICE.md) and the
          # attribution is stated in CHANGELOG.md, which is what the release page
          # shows. GitHub already records a sha256 digest for every uploaded asset,
          # so a separate SHA256SUMS file duplicates it.
          {
            echo "VERSION=$VERSION"
            echo "NAME=$NAME"
          } >> "$GITHUB_ENV"

      # A binary that compiled is not a binary that runs. Alpine has no glibc
      # at all, so this is the cheapest honest check there is: if anything in
      # the build had picked up a shared library, this is where it dies, and it
      # dies here rather than on a user's desktop.
      - name: It has to run on a machine that has nothing
        run: |
          BIN="dist/$NAME"
          file "$BIN" || true
          # A dynamically linked binary always prints `lib => /path`. A static
          # one never does, whatever glibc version prints what in its place.
          if ldd "$BIN" 2>&1 | grep -q '=>'; then
            echo "::error::$BIN links a shared library; it would need the runner's libc"
            exit 1
          fi
          docker run --rm --network=none -v "$PWD/dist:/dist:ro" alpine "/dist/$NAME" --version

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxmproxy-${{ env.VERSION }}-linux-x86_64
          path: dist/
          if-no-files-found: error

      # Tag pushes only. A manual run stops at the artifact above.
      #
      # This job CREATES the release. The macOS job below attaches to the one
      # this creates, so the two can never both be creating it.
      #
      # The notes are CHANGELOG.md and nothing else: the pipeline publishes, it
      # does not narrate. A release page that is a changelog is one thing to keep
      # true; a release page generated by forty lines of shell is two.
      #
      # Only *this* version's section. `--notes-file CHANGELOG.md` hands the
      # whole file to the page, so the second tagged release would show 0.2.0 as
      # well and every release after that would grow. CHANGELOG.md keeps one
      # `## <version>` heading per release and this cuts at the next one.
      #
      # A missing section is an error rather than an empty page: the release
      # still gets built and attached, and a blank changelog is the one failure
      # here nobody would notice until a user read it.
      - name: Attach it to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($0 == "## " v) found = 1 }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section to publish"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "dist/$NAME" \
            --verify-tag --title "nxmproxy $VERSION" --notes-file notes.md

  macos-universal:
    name: "macOS (universal: arm64 + x86_64)"
    # After the Linux job, deliberately. Both jobs write to the same release and
    # only one of them may create it: `gh release create` against an existing
    # tag exits non-zero, which would turn every release into a coin flip on
    # which runner finished first. `needs` makes the answer structural instead
    # of racing.
    needs: linux-x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Both targets, because "Apple silicon only" would strand every Intel
      # user on a binary they cannot execute and cannot rebuild into one that
      # runs. Neither slice is a second-class build: they are the same crate,
      # same lockfile, same profile, differing only in target triple.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: universal-release

      - name: Build
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      # lipo, not a second artifact and not an "Apple silicon" suffix on one.
      # Two assets means the user has to know which Mac they have before they
      # can download, and a wrong download is a dead download.
      - name: Join them
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/nxmproxy \
            target/x86_64-apple-darwin/release/nxmproxy \
            -output dist/nxmproxy
          chmod 755 dist/nxmproxy

      - name: Package
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          NAME="nxmproxy-${VERSION}-macos-universal"
          # A .tar.gz holding the bare binary, for the same reason the Linux
          # job ships a bare binary: this is a command-line tool, not an app,
          # so there is nothing for a .dmg to put a window or a drag-to-
          # Applications icon around. The archive exists only because GitHub
          # attaches files, not directories.
          #
          # No code signing and no notarization. That is a real decision with a
          # real cost, stated rather than buried: the binary is ad-hoc signed
          # by the linker, never Developer ID signed, so Gatekeeper assesses it
          # as a refusal (`spctl --assess --type execute` -> `rejected`, exit
          # 3) and a copy that came from a browser carries
          # `com.apple.quarantine`. The documented remedy is
          # `xattr -dr com.apple.quarantine nxmproxy` after unpacking, or
          # right-click > Open once, and README.md says the same in the install
          # instructions. Notarization needs an Apple Developer ID and a signing
          # identity this project does not have and cannot get one without a
          # human being paid to own it.
          tar -czf "dist/$NAME.tar.gz" -C dist nxmproxy
          # dist/ holds the tarball and nothing else, for the reason the Linux
          # job gives: LICENSE.md and NOTICE.md ship in the repository, GitHub
          # records a digest for every asset, and a release asset is permanent.
          rm dist/nxmproxy
          {
            echo "VERSION=$VERSION"
            echo "NAME=$NAME"
          } >> "$GITHUB_ENV"

      # The macOS equivalent of the alpine check, and the only part of this job
      # that could catch a real defect rather than a packaging mistake.
      #
      # What is actually asserted, in the order it can fail:
      #
      #   1. Both slices are really in the file. `lipo -verify_arch` is the
      #      check that can fail, and it does fail on a thin binary - verified
      #      against a single-architecture build, where it exits 1.
      #   2. Every library it links is one macOS ships. The same reasoning as
      #      the Linux job's `ldd`: a dependency outside /System/Library and
      #      /usr/lib is a dependency the user does not have. The check was
      #      run against a binary linked to a hand-built dylib and catches it.
      #   3. It runs - both slices, each forced through `arch`. `arch` is what
      #      selects the slice, so this is a real execution of the x86_64 half
      #      on an arm64 runner rather than the same slice run twice.
      #
      # NEVER `nxmproxy install` here, and never in any CI step on any platform.
      # `install` calls `LSSetDefaultHandlerForURLScheme`, which needs a GUI
      # session a runner does not have and ABORTS the process without returning
      # an error - killed by a signal, not an exit code. Only `--version`,
      # `--help` and `list` are proven safe on a headless runner.
      - name: It has to be universal, self-contained, and run
        run: |
          BIN="dist/$NAME.tar.gz"
          # Assert on the member, not the path in the build tree: the artifact
          # is what a user downloads, and the file inside the artifact is the
          # thing that has to be both architectures.
          WORK="$(mktemp -d)"
          tar -xzf "$BIN" -C "$WORK"
          lipo "$WORK/nxmproxy" -verify_arch x86_64 arm64
          file "$WORK/nxmproxy"
          if otool -L "$WORK/nxmproxy" | awk '/^[[:space:]]/{print $1}' \
               | grep -qvE '^(/System/Library/|/usr/lib/)'; then
            echo "::error::$BIN links a library that is not part of macOS"
            otool -L "$WORK/nxmproxy"
            exit 1
          fi
          "$WORK/nxmproxy" --version
          arch -x86_64 "$WORK/nxmproxy" --version
          arch -arm64 "$WORK/nxmproxy" --version

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxmproxy-${{ env.VERSION }}-macos-universal
          path: dist/
          if-no-files-found: error

      # Tag pushes only, and it never creates anything: `needs` above means the
      # Linux job has already created the release, and a second
      # `gh release create` against the same tag fails with "release already
      # exists". `upload` is the idempotent form of the same operation - it
      # adds an asset to a release that is there, and re-running this job
      # replaces the asset rather than tripping over it. Verified against the
      # gh that ships on the runner image (2.98.0): `--clobber` exists on
      # `gh release upload`, and it does NOT exist on `gh release edit`, which
      # is the other thing the release page suggests and would not have run.
      #
      # The CHANGELOG cut is redone rather than assumed. The Linux job owns the
      # notes; this job only has to prove that section exists before it adds an
      # asset to the release the notes are on, and a release whose notes are a
      # blank page is the same failure either way.
      - name: Attach it to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($0 == "## " v) found = 1 }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section to publish"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "dist/$NAME.tar.gz" --clobber

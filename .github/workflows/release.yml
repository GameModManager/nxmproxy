# Fork of https://github.com/TanninOne/nxmproxy - see NOTICE.md

# Produces the Linux binary users download. Nothing here creates a tag and
# nothing here is required to test anything: a tag says "this version is real",
# which is a human decision, so the pipeline sits unused until someone makes it.
name: Release

on:
  push:
    tags: ["v*"]
  # Builds the same artifact and uploads it as a workflow artifact, but
  # publishes nothing. This is how the pipeline is proved before a release
  # exists: run it from Actions, download the artifact, run it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build from (blank = the ref the run started on)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The same standard the build on main is held to.
  RUSTFLAGS: "-D warnings"

jobs:
  linux-x86_64:
    name: Linux x86_64 (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-release

      # musl, statically linked, and not glibc.
      #
      # A glibc build of this crate made on this runner links against
      # GLIBC_2.39 and will not start on Ubuntu 22.04 (2.35), Debian 12 (2.36)
      # or anything older - "version `GLIBC_2.39' not found", for a program the
      # user could have run. nxmproxy uses no C library facility that musl
      # lacks: no NSS, no locale collation, no dlopen, no threads beyond what
      # musl provides. So the binary links nothing and runs anywhere, at a cost
      # of roughly 400 KB.
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          NAME="nxmproxy-${VERSION}-linux-x86_64"
          mkdir -p dist
          install -m 755 target/x86_64-unknown-linux-musl/release/nxmproxy "dist/$NAME"
          # dist/ holds the binary and nothing else. A release asset is permanent
          # storage, and GPL-3 does not need it: the licence text and the upstream
          # attribution ship in the repository (LICENSE.md, NOTICE.md) and the
          # attribution is stated in CHANGELOG.md, which is what the release page
          # shows. GitHub already records a sha256 digest for every uploaded asset,
          # so a separate SHA256SUMS file duplicates it.
          {
            echo "VERSION=$VERSION"
            echo "NAME=$NAME"
          } >> "$GITHUB_ENV"

      # A binary that compiled is not a binary that runs. Alpine has no glibc
      # at all, so this is the cheapest honest check there is: if anything in
      # the build had picked up a shared library, this is where it dies, and it
      # dies here rather than on a user's desktop.
      - name: It has to run on a machine that has nothing
        run: |
          BIN="dist/$NAME"
          file "$BIN" || true
          # A dynamically linked binary always prints `lib => /path`. A static
          # one never does, whatever glibc version prints what in its place.
          if ldd "$BIN" 2>&1 | grep -q '=>'; then
            echo "::error::$BIN links a shared library; it would need the runner's libc"
            exit 1
          fi
          docker run --rm --network=none -v "$PWD/dist:/dist:ro" alpine "/dist/$NAME" --version

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxmproxy-${{ env.VERSION }}-linux-x86_64
          path: dist/
          if-no-files-found: error

      # Tag pushes only. A manual run stops at the artifact above.
      #
      # The notes are CHANGELOG.md and nothing else: the pipeline publishes, it
      # does not narrate. A release page that is a changelog is one thing to keep
      # true; a release page generated by forty lines of shell is two.
      #
      # Only *this* version's section. `--notes-file CHANGELOG.md` hands the
      # whole file to the page, so the second tagged release would show 0.2.0 as
      # well and every release after that would grow. CHANGELOG.md keeps one
      # `## <version>` heading per release and this cuts at the next one.
      #
      # A missing section is an error rather than an empty page: the release
      # still gets built and attached, and a blank changelog is the one failure
      # here nobody would notice until a user read it.
      - name: Attach it to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($0 == "## " v) found = 1 }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section to publish"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "dist/$NAME" \
            --verify-tag --title "nxmproxy $VERSION" --notes-file notes.md
